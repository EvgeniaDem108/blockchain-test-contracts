# Основные настройки для testnet
testnet=1
server=1
daemon=1

# Prune mode для экономии места (минимальное значение 550 МБ)
# После синхронизации займет ~2-3 ГБ + служебные файлы
prune=550

# Оптимизация для слабого ПК
dbcache=300                    # ОЗУ под кэш (не больше 500 МБ для слабых ПК)
maxconnections=8               # Ограничение пиров для экономии трафика/CPU

# RPC настройки (доступ из Python)
rpcuser=testuser
rpcpassword=securepassword123

# RPC порт для testnet (стандартный)
rpcport=18332
rpcallowip=127.0.0.1

# Можно добавить для debug (опционально)
printtoconsole=0               # Не засорять консоль

# Где хранить данные блокчейна
datadir=D:\BitcoinData